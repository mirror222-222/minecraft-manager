<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Minecraft Manager</h1>
    <div id="status"></div>
    <button id="startBtn">Start Minecraft</button>
    <button id="stopBtn">Stop Minecraft</button>
    <h2>Edit Whitelist</h2>
    <textarea id="whitelistBox" rows="10" cols="60"></textarea><br>
    <button id="submitWhitelist">Submit Whitelist</button>
    <h2>Error Log (last 100)</h2>
    <textarea id="errorLogBox" rows="10" cols="60" readonly></textarea><br>
    <button id="clearErrorsBtn">Clear Errors</button>
    <script src="/static/app.js"></script>
</body>
</html>
