<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Minecraft Manager</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Minecraft Manager</h1>
    {% if status_message %}
    <div id="status" style="color: {{ 'red' if status_error else 'green' }};">{{ status_message }}</div>
    {% endif %}
    <form method="post" action="/start">
        <button type="submit">Start Minecraft</button>
    </form>
    <form method="post" action="/stop">
        <button type="submit">Stop Minecraft</button>
    </form>
    <h2>Edit Whitelist</h2>
    <form method="post" action="/whitelist">
        <textarea name="whitelistBox" rows="10" cols="60">{{ whitelist_json }}</textarea><br>
        <button type="submit">Submit Whitelist</button>
    </form>
    <h2>Error Log (last 100)</h2>
    <pre style="width:600px;height:180px;overflow:auto;border:1px solid #ccc;background:#f9f9f9;">
{% for err in error_log %}{{ err }}
{% endfor %}
    </pre><br>
    <form method="post" action="/errors/clear">
        <button type="submit">Clear Errors</button>
    </form>
</body>
</html>
